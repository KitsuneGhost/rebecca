<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Recipe Book{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script src="{{ url_for('static', filename='app.js') }}" defer></script></head>
<body>
<header><a class="brand" href="{{ url_for('index') }}">My Recipe Book</a>
{% if user %}<nav aria-label="Main navigation"><a href="{{ url_for('index') }}">Recipes</a><a href="{{ url_for('collections') }}">Collections</a><a href="{{ url_for('profile') }}">My profile</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><button class="link">Log out</button></form></nav>{% endif %}</header>
<main>{% for category, message in get_flashed_messages(with_categories=true) %}<div role="status" class="notice {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>

</body></html>
